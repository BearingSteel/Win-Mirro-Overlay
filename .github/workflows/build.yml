name: build-windows

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Win-Mirro-Overlay.sln

      - name: Build
        shell: pwsh
        run: |
          dotnet build Win-Mirro-Overlay.sln -c Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # 失败时把日志推到 ci-log 分支，方便本地（无需 token）读取诊断。
      - name: Publish build log on failure
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f build.log
          git commit -m "ci: build log"
          git push -f origin ci-log

      - name: Publish (framework-dependent, win-x64)
        run: dotnet publish src/WinMirroOverlay/WinMirroOverlay.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinMirroOverlay-win-x64
          path: publish/
          if-no-files-found: error

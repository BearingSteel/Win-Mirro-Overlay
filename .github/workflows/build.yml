name: build-windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Win-Mirro-Overlay.sln

      - name: Build
        run: dotnet build Win-Mirro-Overlay.sln -c Release --no-restore

      - name: Publish (framework-dependent, win-x64)
        run: dotnet publish src/WinMirroOverlay/WinMirroOverlay.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinMirroOverlay-win-x64
          path: publish/
          if-no-files-found: error

      - name: Publish standalone single-file exe (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/WinMirroOverlay/WinMirroOverlay.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish-standalone

      - name: Rename standalone exe (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Move-Item publish-standalone\WinMirroOverlay.exe "WinMirroOverlay-${{ github.ref_name }}-win-x64.exe"

      - name: Package release zip (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "WinMirroOverlay-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "WinMirroOverlay-${{ github.ref_name }}-win-x64.exe" `
            "WinMirroOverlay-${{ github.ref_name }}-win-x64.zip" `
            --title "Win-Mirro-Overlay ${{ github.ref_name }}" `
            --generate-notes
